<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 792 604" width="792" height="604" role="img" aria-label="Delegation Pass. When the worker starts, the desk signs a short-lived pass, renewed while the work goes on. The worker presents it with each tool call; the gateway verifies signature, expiry, worker and tools on its own, passes allowed calls to the tool server and refuses others. A sub-order gets a narrower pass that names its parent, so anyone holding both can check the narrowing rules offline. Below, the claims inside a pass.">
<style>
svg{--bg:#f4f5f8;--surface:#ffffff;--fg:#171b24;--muted:#5a6376;--line:#c8cdd8;--accent:#2b57c4;--new:#c97a06;--new-bg:#fff4df;--ok:#1d8a59;--stop:#b8402f;
--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme: dark){svg{--bg:#0f1218;--surface:#171b24;--fg:#e6e9f0;--muted:#98a1b3;--line:#353c4a;--accent:#84a6ff;--new:#f0a83c;--new-bg:#2b2214;--ok:#4fc58c;--stop:#ef7a68}}
.frame{fill:var(--bg)}

.bx { fill: var(--surface); stroke: var(--line); stroke-width: 1.3; }
.bx-new { fill: var(--new-bg); stroke: var(--new); stroke-width: 1.8; }
.bx-ok { fill: var(--surface); stroke: var(--ok); stroke-width: 2; }
.bx-end { fill: var(--bg); stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 4 3; }
.bx-hdr { fill: var(--new-bg); stroke: none; }
.ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
.ln-d { stroke: var(--muted); stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; }
.ln-new { stroke: var(--new); stroke-width: 2.4; fill: none; }
.ln-new-d { stroke: var(--new); stroke-width: 1.8; fill: none; stroke-dasharray: 5 4; }
.ln-acc { stroke: var(--accent); stroke-width: 1.8; fill: none; }
.ln-acc-d { stroke: var(--accent); stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
.ln-stop { stroke: var(--stop); stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
.life { stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 3 4; }
.sep { stroke: var(--line); stroke-width: 1; }
.mk-g { fill: var(--muted); } .mk-n { fill: var(--new); } .mk-a { fill: var(--accent); } .mk-s { fill: var(--stop); }
.dot { fill: var(--fg); }
.t { fill: var(--fg); font: 13px var(--sans); }
.tb { font-weight: 600; }
.ts { fill: var(--muted); font: 12px var(--sans); }
.tm { fill: var(--muted); font: 500 11px var(--mono); letter-spacing: .06em; }
.tf { fill: var(--fg); font: 12.5px var(--mono); }
.t-new { fill: var(--new); } .t-acc { fill: var(--accent); } .t-ok { fill: var(--ok); } .t-stop { fill: var(--stop); }
.bar-bg { fill: var(--line); } .bar { fill: var(--new); }
.loop { fill: none; stroke: var(--accent); stroke-width: 1.2; stroke-dasharray: 3 3; }
</style>
<defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-g"/></marker>
    <marker id="ahn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-n"/></marker>
    <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-a"/></marker>
    <marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-s"/></marker>
  </defs>
<rect class="frame" x="0" y="0" width="792" height="604" rx="12"/>
<g transform="translate(16,16)">
  <rect class="bx" x="0" y="0" width="110" height="36" rx="8"/>
  <text class="tm" x="55" y="23" text-anchor="middle">MANAGER</text>
  <line class="life" x1="55" y1="38" x2="55" y2="396"/>
  <rect class="bx" x="130" y="0" width="110" height="36" rx="8"/>
  <text class="tm" x="185" y="23" text-anchor="middle">DESK</text>
  <line class="life" x1="185" y1="38" x2="185" y2="396"/>
  <rect class="bx" x="260" y="0" width="110" height="36" rx="8"/>
  <text class="tm" x="315" y="23" text-anchor="middle">WORKER</text>
  <line class="life" x1="315" y1="38" x2="315" y2="396"/>
  <rect class="bx" x="390" y="0" width="110" height="36" rx="8"/>
  <text class="tm" x="445" y="23" text-anchor="middle">GATEWAY</text>
  <line class="life" x1="445" y1="38" x2="445" y2="396"/>
  <rect class="bx" x="520" y="0" width="110" height="36" rx="8"/>
  <text class="tm" x="575" y="23" text-anchor="middle">TOOL SERVER</text>
  <line class="life" x1="575" y1="38" x2="575" y2="396"/>
  <rect class="bx" x="650" y="0" width="110" height="36" rx="8"/>
  <text class="tm" x="705" y="23" text-anchor="middle">SUB-WORKER</text>
  <line class="life" x1="705" y1="38" x2="705" y2="396"/>

  <line class="ln" x1="57" y1="66" x2="183" y2="66" marker-end="url(#ah)"/>
  <text class="ts" x="120" y="59" text-anchor="middle">create order</text>

  <line class="ln" x1="313" y1="100" x2="187" y2="100" marker-end="url(#ah)"/>
  <text class="ts" x="250" y="93" text-anchor="middle">start</text>

  <rect class="bx-new" x="125" y="116" width="120" height="26" rx="5"/>
  <text class="tf t-new" x="185" y="134" text-anchor="middle">signPass()</text>
  <line class="ln-new" x1="247" y1="129" x2="313" y2="152" marker-end="url(#ahn)"/>
  <text class="ts t-new tb" x="300" y="124" text-anchor="middle">signed pass</text>

  <line class="ln" x1="317" y1="196" x2="443" y2="196" marker-end="url(#ah)"/>
  <text class="ts" x="380" y="189" text-anchor="middle">filings/search + pass</text>
  <rect class="bx-new" x="373" y="206" width="144" height="44" rx="6"/>
  <text class="tf t-new" x="445" y="224" text-anchor="middle">verifyPass()</text>
  <text class="ts" x="445" y="241" text-anchor="middle">sig · exp · sub · tools</text>
  <line class="ln-acc" x1="519" y1="232" x2="573" y2="232" marker-end="url(#aha)"/>
  <text class="ts t-ok tb" x="546" y="225" text-anchor="middle">allowed</text>

  <line class="ln-stop" x1="317" y1="282" x2="443" y2="282" marker-end="url(#ahs)"/>
  <text class="ts" x="380" y="275" text-anchor="middle">web/browse + pass</text>
  <text class="ts t-stop tb" x="380" y="298" text-anchor="middle">refused: not in the pass</text>

  <line class="ln" x1="313" y1="330" x2="187" y2="330" marker-end="url(#ah)"/>
  <text class="ts" x="250" y="323" text-anchor="middle">sub-order</text>

  <line class="ln-new" x1="187" y1="370" x2="703" y2="370" marker-end="url(#ahn)"/>
  <text class="ts t-new tb" x="445" y="362" text-anchor="middle">narrower pass · names its parent</text>

  <text class="ts" x="0" y="422">Anyone holding both passes checks C1–C3 offline: the child's budget, tools and deadline fit inside the parent's.</text>
  <text class="ts" x="0" y="440">The gateway and other teams' systems verify the pass on their own; no call back to the desk.</text>

  <rect class="bx-new" x="0" y="458" width="760" height="120" rx="8"/>
  <text class="tm t-new" x="16" y="479">DELEGATION PASS · SIGNED JWS · ISSUED WHEN WORK STARTS, RENEWED WHILE WORKING</text>
  <text class="tf t-new" x="16" y="504">iss</text><text class="tf" x="124" y="504">desk.example</text>
  <text class="tf t-new" x="16" y="524">sub</text><text class="tf" x="124" y="524">agent:worker</text>
  <text class="tf t-new" x="16" y="544">awl_order</text><text class="tf" x="124" y="544">wo_1</text>
  <text class="tf t-new" x="250" y="504">awl_tools</text><text class="tf" x="356" y="504">["filings/*", "calc/ratio"]</text>
  <text class="tf t-new" x="250" y="524">awl_budget</text><text class="tf" x="356" y="524">{"usd": 2, "tool_calls": 20}</text>
  <text class="tf t-new" x="250" y="544">awl_parent</text><text class="tf" x="356" y="544">set on sub-orders</text>
  <text class="tf t-new" x="600" y="504">iat</text><text class="tf" x="640" y="504">09:00Z</text>
  <text class="tf t-new" x="600" y="524">exp</text><text class="tf" x="640" y="524">09:15Z</text>
  <text class="tf t-new" x="600" y="544">jti</text><text class="tf" x="640" y="544">p_8f3a</text>
  <text class="tf t-new" x="16" y="564">awl_deadline</text><text class="tf" x="124" y="564">12:00Z</text>
  <text class="tf t-new" x="250" y="564">awl_attempt</text><text class="tf" x="356" y="564">1</text>
  <text class="tf t-new" x="600" y="564">typ</text><text class="tf" x="640" y="564">awl-pass+jwt</text>
</g>
</svg>
