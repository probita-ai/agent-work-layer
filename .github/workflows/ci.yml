name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  python:
    runs-on: ${{ matrix.os }}
    strategy:
      # One version failing shouldn't cancel the other's run.
      fail-fast: false
      matrix:
        include:
          # 3.9 is the lowest version pyproject.toml supports. setup-python has no 3.9 build for
          # Ubuntu 26.04 (ubuntu-latest), so it runs on 24.04.
          - python: "3.9"
            os: ubuntu-24.04
          - python: "3.13"
            os: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[test]"
      - run: pytest
