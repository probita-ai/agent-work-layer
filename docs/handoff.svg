<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 792 432" width="792" height="432" role="img" aria-label="Handoff: Worker A reports failed and includes a handoff. The manager reissues the job as a new Work Order to Worker B carrying the same handoff, with summary, decisions, what was tried, open questions and the next step, so Worker B does not repeat what failed.">
<style>
svg{--bg:#f4f5f8;--surface:#ffffff;--fg:#171b24;--muted:#5a6376;--line:#c8cdd8;--accent:#2b57c4;--new:#c97a06;--new-bg:#fff4df;--ok:#1d8a59;--stop:#b8402f;
--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme: dark){svg{--bg:#0f1218;--surface:#171b24;--fg:#e6e9f0;--muted:#98a1b3;--line:#353c4a;--accent:#84a6ff;--new:#f0a83c;--new-bg:#2b2214;--ok:#4fc58c;--stop:#ef7a68}}
.frame{fill:var(--bg)}
.bx { fill: var(--surface); stroke: var(--line); stroke-width: 1.3; }
.bx-new { fill: var(--new-bg); stroke: var(--new); stroke-width: 1.8; }
.bx-ok { fill: var(--surface); stroke: var(--ok); stroke-width: 2; }
.bx-stop { fill: var(--surface); stroke: var(--stop); stroke-width: 1.6; }
.ln-new { stroke: var(--new); stroke-width: 2.4; fill: none; }
.ln-new-d { stroke: var(--new); stroke-width: 1.8; fill: none; stroke-dasharray: 5 4; }
.sep { stroke: var(--new); stroke-width: 1; opacity: .5; }
.mk-n { fill: var(--new); }
.t { fill: var(--fg); font: 13px var(--sans); }
.tb { font-weight: 600; }
.ts { fill: var(--muted); font: 12px var(--sans); }
.tm { fill: var(--muted); font: 500 11px var(--mono); letter-spacing: .06em; }
.tf { fill: var(--fg); font: 12.5px var(--mono); }
.tk { fill: var(--new); font: 500 12px var(--mono); }
.t-new { fill: var(--new); } .t-ok { fill: var(--ok); } .t-stop { fill: var(--stop); }
</style>
<defs>
  <marker id="ahn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-n"/></marker>
</defs>
<rect class="frame" x="0" y="0" width="792" height="432" rx="12"/>

<text class="tm" x="32" y="36">HANDOFF · A JOB MOVES TO ANOTHER WORKER WITHOUT STARTING OVER</text>

<!-- actors -->
<rect class="bx-stop" x="32" y="58" width="180" height="78" rx="8"/>
<text class="t tb" x="122" y="86" text-anchor="middle">Worker A</text>
<text class="ts t-stop" x="122" y="106" text-anchor="middle">reports failed</text>
<text class="ts" x="122" y="123" text-anchor="middle">out of memory on 2 GB file</text>

<rect class="bx" x="306" y="58" width="180" height="78" rx="8"/>
<text class="t tb" x="396" y="86" text-anchor="middle">Manager agent</text>
<text class="ts" x="396" y="106" text-anchor="middle">reissues the job</text>
<text class="ts" x="396" y="123" text-anchor="middle">to another worker</text>

<rect class="bx-ok" x="580" y="58" width="180" height="78" rx="8"/>
<text class="t tb" x="670" y="86" text-anchor="middle">Worker B</text>
<text class="ts t-ok" x="670" y="106" text-anchor="middle">skips what failed</text>
<text class="ts" x="670" y="123" text-anchor="middle">starts from next_step</text>

<!-- messages -->
<path class="ln-new" d="M212 97 H302" marker-end="url(#ahn)"/>
<text class="tm t-new" x="259" y="87" text-anchor="middle">Work Report</text>
<path class="ln-new" d="M486 97 H576" marker-end="url(#ahn)"/>
<text class="tm t-new" x="533" y="87" text-anchor="middle">Work Order</text>

<!-- the handoff rides on both messages -->
<path class="ln-new-d" d="M259 102 V188"/>
<path class="ln-new-d" d="M533 188 V102"/>
<text class="ts t-new" x="271" y="160">+ handoff</text>
<text class="ts t-new" x="521" y="160" text-anchor="end">+ same handoff</text>

<!-- the handoff object -->
<rect class="bx-new" x="146" y="188" width="500" height="190" rx="10"/>
<text class="tf tb" x="166" y="214">handoff</text>
<text class="ts" x="626" y="214" text-anchor="end">same shape in the report and the order</text>
<line class="sep" x1="146" y1="228" x2="646" y2="228"/>
<text class="tk" x="166" y="256">summary</text><text class="tf" x="300" y="256">Parser done; export fails over 2 GB</text>
<text class="tk" x="166" y="282">decisions</text><text class="tf" x="300" y="282">stream rows · why: memory limit</text>
<text class="tk" x="166" y="308">tried</text><text class="tf" x="300" y="308">xlsx library · result: too slow</text>
<text class="tk" x="166" y="334">open_questions</text><text class="tf" x="300" y="334">quote style for commas?</text>
<text class="tk" x="166" y="360">next_step</text><text class="tf" x="300" y="360">add tests for null cells</text>

<text class="ts" x="396" y="410" text-anchor="middle">context lists what to read · handoff says what was decided and what was already tried</text>
</svg>
