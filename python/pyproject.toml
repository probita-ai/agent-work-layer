[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "agent-work-layer"
version = "0.3.0"
description = "Work Orders and Work Reports for AI agents: Pydantic models and the spec's validation rules."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Probita" }]
requires-python = ">=3.9"
dependencies = ["jsonschema>=4.18", "pydantic>=2.6"]
keywords = ["ai", "agents", "multi-agent", "mcp", "a2a", "work-order", "llm", "orchestration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/probita-ai/agent-work-layer/tree/main/python#readme"
Repository = "https://github.com/probita-ai/agent-work-layer"
Issues = "https://github.com/probita-ai/agent-work-layer/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_work_layer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "pyproject.toml"]
